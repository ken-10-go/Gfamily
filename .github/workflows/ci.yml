name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Firestore エミュレータの実行に必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions

      - name: Typecheck
        run: npm run typecheck && npm run typecheck --prefix functions

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Security rules tests
        run: npm run test:rules

      - name: Build
        run: npm run build
