name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix functions

      # 壊れたものを自動で本番へ出さないための関門。
      # ルールのテストは Java が要るため ci.yml に任せ、ここでは走らせない。
      - name: Typecheck
        run: npm run typecheck && npm run typecheck --prefix functions

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Firebase のクライアント設定は公開前提の値だが、プロジェクトごとに異なるため
          # リポジトリ変数（Secrets ではなく Variables）で持つ
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      # サービスアカウントの鍵はファイルに書き出して firebase-tools に渡す。
      # ジョブ終了とともに破棄される一時ディレクトリに置く。
      - name: Authenticate to Firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"

      # Hosting とセキュリティルール・インデックスだけを反映する。
      #
      # Functions は意図的に外している。CI からデプロイするには鍵に
      # Cloud Functions 管理者・Service Account User・Artifact Registry・Cloud Run・
      # Eventarc といった広い権限が必要になり、公開リポジトリに置く鍵としては強すぎる。
      # Functions（招待の発行/受諾・監査ログのトリガー）は変更頻度が低いため、
      # functions/ を変えたときだけ手元から手動でデプロイする。README を参照。
      - name: Deploy
        run: >
          npx firebase-tools deploy
          --only hosting,firestore
          --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}"
          --non-interactive
