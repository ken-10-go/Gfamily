name: Deploy to Firebase

# 作業ブランチへの push でも本番へ反映する。
# PR を作ってマージするまで画面が更新されないと、スマホから直した内容が
# いつまでも家族に届かないため。関門は下の検査（typecheck / lint / テスト / build）で、
# どれか1つでも落ちればデプロイ手順まで進まない。
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

# 別のブランチから同時に走っても、あとから始めたほうを待たせる。
# 途中で止めると中途半端な状態が本番に残るので cancel はしない。
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Firestore エミュレータ（ルールのテスト）の実行に必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions

      # 壊れたものを自動で本番へ出さないための関門。
      - name: Typecheck
        run: npm run typecheck && npm run typecheck --prefix functions

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # ルールも自動で反映するので、権限制御が壊れていないことをここで必ず確かめる。
      # このテストが落ちたらデプロイはしない。
      - name: Security rules tests
        run: npm run test:rules

      - name: Build
        env:
          # Firebase のクライアント設定は公開前提の値だが、プロジェクトごとに異なるため
          # リポジトリ変数（Secrets ではなく Variables）で持つ
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      # サービスアカウントの鍵はファイルに書き出して firebase-tools に渡す。
      # ジョブ終了とともに破棄される一時ディレクトリに置く。
      - name: Authenticate to Firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"

      # 画面（Hosting）と、アクセス制御まわり（ルール・インデックス）を反映する。
      #
      # Functions は自動化しない。デプロイに Cloud Functions 管理者・Service Account User・
      # Artifact Registry・Cloud Run・Eventarc といった広い権限が要り、
      # 公開リポジトリの Secrets に置く鍵としては強すぎるため。手順は README を参照。
      - name: Deploy
        run: >
          npx firebase-tools deploy
          --only hosting,firestore
          --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}"
          --non-interactive
